resources:
  jobs:
    # Element 3 — automated file detection. Deployed PAUSED so it does not
    # fire during rehearsal. Runs on the existing all-purpose cluster
    # (onr demo cluster). Does not create compute.
    grants_file_arrival:
      name: onr-demo-grants-file-arrival
      description: >-
        Element 3 — Auto-detect new files under
        /Volumes/${var.catalog}/bronze/landing/grants and refresh
        bronze → silver → gold.
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/landing/grants
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 15
      queue:
        enabled: true
      tasks:
        - task_key: bronze_ingest
          existing_cluster_id: ${var.job_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_quality
          depends_on:
            - task_key: bronze_ingest
          existing_cluster_id: ${var.job_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/02_silver_quality.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_quality
          existing_cluster_id: ${var.job_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/03_gold_aggregation.py
            base_parameters:
              catalog: ${var.catalog}

    # Element 5 — score the current silver portfolio from registered models.
    # Manual run only. Uses the existing score cluster (onr demo ml).
    # The Compass app can still submit 04c the same way; this job is the
    # version-controlled path for CI / operators.
    score_registered_models:
      name: onr-demo-score-registered-models
      description: >-
        Element 5 — Score silver.grants from registered models / night-before
        runs onto gold.grant_predictions and gold.grant_anomaly_scores.
      queue:
        enabled: true
      tasks:
        - task_key: score
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/04c_score_registered_models.py
            base_parameters:
              catalog: ${var.catalog}
