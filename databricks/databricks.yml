bundle:
  name: enterprise_analytics_dab

include:
  - ./resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-dev-gov.cloud.databricks.com
      root_path: /Users/service_principal/.bundle/${bundle.name}/dev

  test:
    mode: production
    workspace:
      host: https://adb-test-gov.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/test

  prod:
    mode: production
    workspace:
      host: https://adb-prod-gov.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/prod

resources:
  jobs:
    budget_execution_pipeline:
      name: "[${bundle.target}] Budget Execution & Forecasting Pipeline"
      tasks:
        - task_key: streaming_ingestion_task
          job_cluster_key: analytics_gpu_cluster
          spark_python_task:
            python_file: ./src/analytics/budget_forecasting.py
            parameters:
              - "--env"
              - "${bundle.target}"

      job_clusters:
        - job_cluster_key: analytics_gpu_cluster
          new_cluster:
            spark_version: 14.3.x-gpu-ml-scala2.12
            node_type_id: g5.xlarge
            autoscale:
              min_workers: 1
              max_workers: 8
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
